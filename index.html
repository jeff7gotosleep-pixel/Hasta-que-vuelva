
<!DOCTYPE html>

    #contador {
      font-size: 2em;
      background: rgba(0,0,0,0.5);
      padding: 15px 25px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <h1>Cuenta regresiva hasta el sábado...<br> Que vuelve azaroth</h1>

  <div id="contador">Calculando...</div>

  <script>
    function ahoraLocal() {
      return new Date(); // usa hora del navegador automáticamente
    }

    function obtenerFechaObjetivo() {
      const ahora = ahoraLocal();
      const diaActual = ahora.getDay(); // 0=Domingo, 6=Sábado

      let fechaObjetivo = new Date(ahora);

      if (diaActual === 6) {
        // Sábado → fin del día local
        fechaObjetivo.setHours(23, 59, 59, 999);
      } else {
        let diasRestantes = 6 - diaActual;
        if (diasRestantes < 0) diasRestantes += 7;

        fechaObjetivo.setDate(ahora.getDate() + diasRestantes);
        fechaObjetivo.setHours(0, 0, 0, 0);
      }

      return fechaObjetivo;
    }

    function actualizarContador() {
      const ahora = ahoraLocal();
      const fechaObjetivo = obtenerFechaObjetivo();

      const diferencia = fechaObjetivo.getTime() - ahora.getTime();
      const diaActual = ahora.getDay();

      let mensajeExtra = "";

      if (diaActual === 6) {
        mensajeExtra = "<br><small>vuelve en algun momento de hoy</small>";
      }

      if (diferencia <= 0) {
        document.getElementById("contador").innerHTML =
          diaActual === 6
            ? "Hoy es sábado 🎉" + mensajeExtra
            : "¡Ya es sábado!";
        return;
      }

      const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
      const horas = Math.floor((diferencia / (1000 * 60 * 60)) % 24);
      const minutos = Math.floor((diferencia / (1000 * 60)) % 60);
      const segundos = Math.floor((diferencia / 1000) % 60);

      document.getElementById("contador").innerHTML =
        `${dias} días ${horas} horas ${minutos} minutos ${segundos} segundos` + mensajeExtra;
    }

    setInterval(actualizarContador, 1000);
    actualizarContador();
  </script>

</body>
